<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Jojean Montecalvo</title>

    <h1>CSS Display Property</h1>

    <style>
        .box1 {
            width: 300px;
            height: 300px;
            background-color: red;
            display: inline-block;
        }

        .box2 {
            width: 300px;
            height: 300px;
            background-color: green;
            display: inline-block;
        }

        .box3 {
            width: 300px;
            height: 300px;
            background-color: blue;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="box1">Red Paragraph</div>
    <div class="box2">Green Paragraph</div>
    <div class="box3">Blue Paragraph</div>
