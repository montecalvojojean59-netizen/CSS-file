<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jojean Montecalvo</title>

    <style>

        
        body {
            background-color: #202020;
            margin: 0;
            padding: 0;
        }

       
        .container {
            background-color: #6493e5;
            width: 90%;
            min-height: 100vh;
            margin: 0 auto;
            padding: 25px 8px;
            box-sizing: border-box;
            color: white;
        }

    
        h1 {
            font-size: 55px;
            margin: 0;
        }

        
        .color {
            color: orangered;
            font-size: 30px;
            margin-top: 45px;
        }

    
        .font-size {
            font-size: 90px;
            margin-top: 110px;
        }

      
        .font-weight {
            font-size: 30px;
            font-weight: bold;
            margin-top: 105px;
        }

      
        .font-family {
            font-family: cursive;
            font-size: 27px;
            margin-top: 35px;
        }


        .text-align {
            text-align: right;
            font-size: 30px;
            margin-top: 35px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Important CSS Properties</h1>

        <p class="color">Color</p>

        <p class="font-size">Font Size</p>

        <p class="font-weight">Font Weight</p>

        <p class="font-family">Font Family</p>

        <p class="text-align">Text Align</p>

    </div>

</body>
</html>
