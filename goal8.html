<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Jojean Montecalvo</title>

    <style>
        #box {
            width: 500px;
            height: 300px;
            background-color: blue;
            margin-left: 200px;
            margin-top: 200px;
            position: relative;
        }

        #circle {
            width: 200px;
            height: 200px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            left: 250px;
            top: 150px;
        }
    </style>
</head>

<body>

    <div id="box">
        <div id="circle"></div>
    </div>

</body>

</html>
